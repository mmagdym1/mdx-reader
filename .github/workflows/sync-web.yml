name: Sync generated web pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild standalone web pages
        run: npm run standalone

      - name: Commit generated pages when changed
        run: |
          if git diff --quiet -- MDX-Reader-Standalone.html docs/index.html; then
            echo "Generated pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MDX-Reader-Standalone.html docs/index.html
          git commit -m "Sync generated web pages"
          git push
