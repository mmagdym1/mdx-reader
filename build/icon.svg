<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#gloss)"/>

  <!-- الورقة -->
  <g filter="url(#sh)">
    <rect x="52" y="42" width="152" height="172" rx="16" fill="#ffffff"/>
  </g>

  <!-- سطور توحي بمستند: واحد يمين (عربي) وواحد شمال (إنجليزي) -->
  <rect x="118" y="66" width="66" height="9" rx="4.5" fill="#c7d2fe"/>
  <rect x="72"  y="86" width="52" height="9" rx="4.5" fill="#e0e7ff"/>

  <!-- شعار Markdown: حرف M + سهم لأسفل -->
  <path d="M70 176 V116 H86 L104 140 L122 116 H138 V176 H122 V142 L104 164 L86 142 V176 Z" fill="url(#mark)"/>
  <path d="M156 116 h16 v34 h16 l-24 30 l-24 -30 h16 z" fill="url(#mark)"/>
</svg>
